# Guardrail patterns (owner: B, W1 Policy and guardrails).
# Used by src/guardrails/. Patterns are case-insensitive regular expressions
# (masking is case-sensitive; see its note). Every list cites the rule ID it enforces.
#
# version: v1.0, matching 311 Operating Policy v1.0 and policy.yaml v1.0.
# Change log
#   v0.1 (Nov 2)  first patterns
#   v1.0 (Nov 20) E1: 'fire' no longer matches look-alikes such as 'fire hydrant'
#                 or 'fire pit'; adds smoke from a building, sparking or exposed wires,
#                 open manhole or sewer cover (Policy v1.0 E1, SDD 2.2).
#                 E7: complaint about staff.  D2: driver's licence, passport.
#                 D6: postal code masked after the first three characters.
#                 C1/C2/C3/C4/C7: wider commitment list (time windows in words,
#                 'urgent', by-law violation, the City paying, visit or inspection).
#                 D6: phone no longer matches digits inside a UUID or longer ID.
# Note: the input screen turns each list name below into a flag, so do not add a
# new list under input_screen without code that handles the flag.

input_screen:
  # E1 [hard]: danger to life or safety now -> 911 wording, no ticket, no model call.
  # A word alone such as 'fire hydrant' is not E1 (look-alikes in policy.yaml routes.EMERG).
  emergency:
    - '\bfire\b(?!\s*(?:hydrants?|pits?|hall|station|department|dept|route|lanes?|zone|extinguishers?|alarm test|code|inspect|safety|ban|works?)\b)'
    - '\b(?:on fire|in flames|flames (?:coming|shooting))\b'
    - '\bsmell(s|ing)? (of )?gas\b'
    - '\bgas (leak|smell)\b'
    - '\bsmoke\b[^.!?]{0,40}\b(?:building|house|home|apartment|condo|window|roof|garage|basement|unit|store|school)\b'
    - '\b(?:building|house|home|apartment|condo|garage|basement|roof)\b[^.!?]{0,30}\bsmok(?:e|ing)\b'
    - '\blive (wire|wires|power line)\b'
    - '\bdowned (power )?lines?\b'
    - '\b(?:wires?|cables?|power lines?|pole|transformer)\b(?:(?!\b(?:not|nothing|no|isn''t|aren''t)\b)[^.!?]){0,30}\bspark(?:s|ing|ed)?\b'
    - '(?<!not )(?<!no )\bspark(?:s|ing)\b[^.!?]{0,30}\b(?:wires?|cables?|power lines?|pole|transformer)\b'
    - '\b(?:exposed|bare|hanging|dangling) (?:electrical |electric |power )?(?:wires?|cables?)\b'
    - '\b(?:open|missing|uncovered|no) (?:manhole|sewer)(?: cover| lid)?\b'
    - '\b(?:manhole|sewer)(?: cover| lid)?\b[^.!?]{0,20}\b(?:open|missing|off|gone|removed)\b'
    - '\b(car )?crash\b.*\b(injur|hurt|bleed)'
    - '\b(break[- ]?in|robbery|assault) (in progress|happening)\b'
    - '\bsomeone is (threatening|attacking)\b'
    - '\b(not breathing|unconscious|heart attack)\b'
  # E8: distress or self-harm -> hand off with crisis line
  self_harm:
    - '\b(kill|hurt|harm) myself\b'
    - '\bsuicid'
    - '\bend my life\b'
    - '\bwant to die\b'
  # S1 / S5: prompt injection; flagged, treated as data, never obeyed.
  # S5: the same list must also run on tool arguments (address, description): code to build.
  injection:
    - 'ignore (all |any )?(previous|prior|above|your) (instructions|rules|prompt)'
    - '\b(system prompt|developer message)\b'
    - '\byou are now\b'
    - '\bact as\b'
    - '\bjailbreak\b'
    - '\breveal (your|the) (prompt|instructions|rules)'
  # E7: asks for a person, complaint about staff, legal threat
  human_request:
    - '\b(speak|talk) (to|with) (a |an )?(human|person|agent|someone|supervisor|manager)\b'
    - '\b(lawyer|sue|lawsuit|legal action)\b'
    - '\b(?:complain|complaint|complaining)\b[^.!?]{0,30}\b(?:staff|worker|crew|driver|employee|inspector|officer)\b'

redaction:
  # D2 [hard]: never stored; replaced before storage AND before the model sees it
  sin: '\b\d{3}[ -]?\d{3}[ -]?\d{3}\b'
  # Skips 311 ticket numbers (311-2026-000123), which also have 13 digits.
  payment_card: '\b(?!311-\d{4}-\d{6}\b)(?:\d[ -]?){13,16}\b'
  date_of_birth: '\b(?:dob|date of birth|born on)\b[^.\n]{0,25}\d'
  health_card: '\b\d{4}[ -]?\d{3}[ -]?\d{3}[ -]?[A-Z]{2}\b'
  # D2 government ID: Ontario-style driver's licence (A1234-56789-01234); passport after the word
  drivers_licence: '\b[A-Z]\d{4}[ -]?\d{5}[ -]?\d{5}\b'
  passport: '\bpassport\b[^.\n]{0,20}\b[A-Z]{1,2}\d{6,7}\b'

masking:
  # D6 [hard]: applied to every log write (interaction_events, handoffs).
  # Compiled case-SENSITIVE so the name pattern can rely on capitals; use
  # (?i:...) for parts that should ignore case. A pattern with a group masks
  # only the group.
  email: '[\w.+-]+@[\w-]+\.[\w.-]+'
  # (?<![\w-]) / (?![\w-]): not inside a longer ID such as a UUID or ticket number
  phone: '(?<![\w-])(?:\+?1[ .-]?)?\(?\d{3}\)?[ .-]?\d{3}[ .-]?\d{4}(?![\w-])'
  unit: '(?:\b(?i:unit|apt|apartment|suite)\s*#?|#\s*)\d+[a-zA-Z]?\b'
  street_number: '\b\d{1,6}(?=\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+(?:St|Street|Ave|Avenue|Rd|Road|Blvd|Dr|Drive|Cres|Crescent|Ct|Court|Way|Lane|Ln|Pl|Place|Terrace|Pkwy)\b)'
  name: '(?i:my name is|this is|i am|i''m)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)'
  # D6: keep the first three characters (G1A), mask the rest ("G1A [POSTAL_CODE]")
  postal_code: '(?i:\b[A-Z]\d[A-Z][ -]?(\d[A-Z]\d)\b)'

output_check:
  # C1/C2/C3/C4/C7 [hard]: commitments the agent must never make.
  # Flagged and logged today; Policy v1.0 says replace the reply with the approved
  # wording (src/guardrails/output_check.py + flow.yaml commitment node: to build).
  commitment:
    # C1: a date or time window, in digits or words
    - '\b(within|in) (?:\d+|a|an|one|two|three|four|five|a few|a couple of) (business )?(hours?|days?|weeks?|months?)\b'
    - '\b(by|on) (monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow)\b'
    - '\b(?:will|should|going to|expect(?:ed)? to)\b[^.!?]{0,40}\b(?:today|tonight|tomorrow|this week|next week|by the end of the (?:day|week|month)|soon|shortly|right away)\b'
    - '\b(?:target|service standard|turnaround) (?:time|is)\b'
    # C2: a priority level or urgency for the City
    - '\b(high|top|urgent|highest|low) priority\b'
    - '\b(?:prioriti[sz]ed?|fast[- ]?track(?:ed)?|expedited?)\b'
    - '\b(?:marked|flagged|treated|logged)\b[^.!?]{0,15}\b(?:as )?urgent\b'
    # C3: a by-law violation or a fine
    - '\b(will be|you will be|they will be) fined\b'
    - '\b(?:will|could|may|might) (?:be|get) (?:fined|ticketed|charged)\b'
    - '\b(?:is|was|are|were|be|not) (?:a )?(?:by-?law )?violations?\b'
    - '\b(?:violat(?:es|ed|ing)|breach(?:es|ed)?|against|breaking) (?:the |a |our )?(?:by-?laws?|bylaws?)\b'
    # C4: refunds, compensation, liability, fee waivers
    - '\b(refund|compensat|reimburs|waive)'
    - '\b(?:the city|we|they) (?:will|is going to|are going to) (?:pay|cover)\b'
    # C7: someone will visit, inspect or investigate
    #   ("I can't say whether someone will visit" is the approved wording, so 'whether' / 'if' before the subject is allowed)
    - '(?<!whether )(?<!if )\b(?:someone|somebody|an? crew|crews|an? inspector|an? officer|an? technician|staff|they|we|the city|the team|the unit)(?: will|''ll| is going to| are going to| shall)\b[^.!?]{0,25}\b(?:visit|inspect|investigate|come (?:out|by)|stop by|look into (?:it|this))\b'
    - '\b(?:will|''ll|going to)\s+send\s+(?:someone|somebody|a crew|an inspector|an officer|staff|a technician)\b'
  # M3 [hard]: any ticket ID in a reply must have been returned by a tool
  ticket_id: '\b311-\d{4}-\d{6}\b'
  # M3 [hard]: claiming a request was created when create_ticket returned no ID
  ticket_claim: '\b(created|filed|submitted|opened|logged)\b[^.]{0,30}\b(request|ticket|report)\b|\b(request|ticket)\b[^.]{0,30}\b(has been|was) (created|filed|submitted)\b'
  handoff_ref: '\bHO-\d{4}-\d{6}\b'
  # D8: policy rule IDs echoed from the prompt, e.g. "(M1)", "[E2]", "(rule C1, C5)". Removed from replies.
  rule_id_tag: '[ \t]*[(\[]\s*(?:rules?\s+)?[ACDEMSF]\d{1,2}\b(?:\s*(?:,|/|&|and)\s*[ACDEMSF]\d{1,2}\b)*\s*[)\]]'
